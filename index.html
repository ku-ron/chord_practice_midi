<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="コード練習">
<meta name="theme-color" content="#14110f">
<title>コード弾き練習（MIDI）</title>
<style>
  :root{
    --bg:#14110f; --panel:#1d1a17; --panel2:#262220; --line:#3a3430;
    --fg:#efe7d8; --dim:#9c9483; --brass:#c9a227;
    --ok:#5ddba0; --ng:#e2645f; --info:#6fb6e8;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%}
  body{
    background:var(--bg); color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
    font-size:15px; line-height:1.5; -webkit-text-size-adjust:100%;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .wrap{max-width:760px;margin:0 auto;padding:10px 12px 32px}

  /* ---- 上段 ---- */
  .top{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;
    color:var(--dim);font-size:13px;min-height:26px}
  .top .key{color:var(--fg);font-size:19px;font-weight:600;
    min-width:3.4em;font-variant-numeric:tabular-nums}
  .top .sp{margin-left:auto}

  /* ---- コード表示 ---- */
  .stage{
    background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:18px 16px 14px;margin:8px 0 10px;text-align:center;
    transition:background .12s, border-color .12s;
  }
  .stage.good{background:#1b2c22;border-color:#3d6b52}
  .stage.bad{background:#2c1c1b;border-color:#6b3a38}
  .chord{
    font-size:clamp(44px,13vw,76px);line-height:1.1;font-weight:600;letter-spacing:.01em;
    min-height:1.15em;
  }
  .chord .b{font-size:.52em;font-weight:400;color:var(--dim)}
  .deg{font-size:14px;color:var(--dim);font-family:ui-monospace,Menlo,monospace;min-height:1.4em}
  .next{font-size:14px;color:var(--dim);margin-top:6px;min-height:1.4em}
  .next b{color:#b9ad97;font-weight:600}

  /* ---- 状態行 ---- */
  .msg{text-align:center;font-size:15px;min-height:1.6em;margin:2px 0 8px}
  .msg.ok{color:var(--ok)} .msg.ng{color:var(--ng)} .msg.dim{color:var(--dim)}

  /* ---- 鍵盤 ---- */
  .kbwrap{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px;margin-bottom:10px}
  svg.kb{display:block;width:100%;height:auto}

  /* ---- チップ ---- */
  .chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;min-height:32px;align-items:center}
  .chip{border-radius:6px;padding:4px 9px;font-size:14px;
    font-family:ui-monospace,Menlo,monospace;border:1px solid}
  .chip.need{background:#22262e;border-color:#3d4756;color:#a8b4c6}
  .chip.opt{background:#22262e;border-color:#3d4756;color:#6f7b8c;border-style:dashed}
  .chip.got{background:#20404f;border-color:#3f7794;color:#bfe6ff}
  .chip.bad{background:#402020;border-color:#7d3c3a;color:#ffc4c2}
  .chip.bass{outline:2px solid var(--brass);outline-offset:1px}
  .chip.bassng{outline:2px dashed #7d6b5c;outline-offset:1px}
  .lbl{font-size:11px;color:var(--dim);text-align:center;margin:8px 0 3px}

  /* ---- パネル・操作 ---- */
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px}
  .panel h2{font-size:12px;margin:0 0 8px;color:var(--dim);font-weight:600;letter-spacing:.05em}
  .row{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
  button{background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:8px;
    padding:8px 13px;font-size:14px;font-family:inherit;cursor:pointer;min-height:38px}
  button:active{background:#332d29}
  button.on{background:var(--brass);border-color:var(--brass);color:#241d05;font-weight:600}
  button.primary{background:var(--brass);border-color:var(--brass);color:#241d05;font-weight:600}
  button:disabled{opacity:.45;cursor:default}
  button.sm{padding:5px 10px;min-height:32px;font-size:13px}
  select,input[type=number]{background:var(--panel2);color:var(--fg);border:1px solid var(--line);
    border-radius:8px;padding:8px 10px;font-size:14px;font-family:inherit;min-height:38px}
  .pat-btn{padding:6px 11px;min-height:34px;font-size:13px}
  .plist{display:flex;flex-direction:column;gap:5px;max-height:240px;overflow-y:auto;margin-top:8px}
  .plist button{text-align:left;justify-content:flex-start;font-size:13px;padding:8px 11px;min-height:36px}
  .note-s{font-size:12px;color:var(--dim);margin-top:6px}
  #status{font-size:13px;padding:7px 10px;border-radius:8px;background:var(--panel2);
    border:1px solid var(--line);color:var(--dim)}
  #status.ok{color:var(--ok);border-color:#2f5a45}
  #status.ng{color:var(--ng);border-color:#5a3130}
  details summary{cursor:pointer;color:var(--dim);font-size:13px;padding:6px 0;list-style:none}
  details summary::-webkit-details-marker{display:none}
  details summary::before{content:'▸ ';}
  details[open] summary::before{content:'▾ ';}
  a{color:var(--info)}
</style>
</head>
<body>
<div class="wrap">

  <div class="top">
    <span class="key" id="keyName">—</span>
    <span id="progName">—</span>
    <span class="sp" id="counter">—</span>
  </div>

  <div class="stage" id="stage">
    <div class="deg" id="deg">&nbsp;</div>
    <div class="chord" id="chord">—</div>
    <div class="next" id="next">&nbsp;</div>
  </div>

  <div class="msg dim" id="msg">「MIDIに接続」を押してください</div>

  <div class="kbwrap"><svg class="kb" id="kb" viewBox="0 0 100 26" preserveAspectRatio="none"></svg></div>

  <div id="hintBox" hidden>
    <div class="lbl">構成音</div>
    <div class="chips" id="hintChips"></div>
  </div>
  <div class="lbl">押している音</div>
  <div class="chips" id="playChips"><span style="color:var(--dim);font-size:13px">なし</span></div>

  <div class="panel" style="margin-top:12px">
    <div class="row">
      <button id="btnConnect" class="primary">MIDIに接続</button>
      <button id="btnSkip">スキップ</button>
      <button id="btnHint">音名ヒント</button>
      <button id="btnRestart">最初から</button>
    </div>
    <div id="status" style="margin-top:8px">未接続</div>
  </div>

  <details class="panel">
    <summary>練習の設定</summary>

    <h2 style="margin-top:10px">コード進行</h2>
    <div class="row" id="tabs"></div>
    <div class="plist" id="plist"></div>
    <div class="note-s" id="presetNote"></div>

    <h2 style="margin-top:14px">キーの進み方（1周したら）</h2>
    <div class="row" id="keyPat"></div>

    <h2 style="margin-top:14px">表示</h2>
    <div class="row">
      <button id="btnNotation">ジャズ表記</button>
      <button id="btnDegree" class="on">度数を表示</button>
    </div>

    <h2 style="margin-top:14px">判定</h2>
    <div class="row">
      <label style="color:var(--dim);font-size:13px">ミスを赤くするまでの猶予
        <input type="number" id="grace" value="60" min="0" max="500" step="10" style="width:5.5em;margin-left:6px"> ms</label>
    </div>
    <div class="note-s">和音は同時に押せないので、コードの移り変わりを誤検出しないための待ち時間。正解の判定には猶予は使いません（そろった瞬間に正解）。</div>

    <h2 style="margin-top:14px">その他</h2>
    <div class="row">
      <button class="sm" onclick="location.reload()">再読み込み</button>
      <a class="sm" href="monitor.html" style="align-self:center">MIDIモニタ</a>
    </div>
  </details>

</div>

<script>
'use strict';

/* ===================== 音名：五度圏上の整数（C=0, G=1, F=-1 …） =====================
   既存アプリ chord_practice から流用。異名同音が調ごとに正しく綴られる。 */
const L2F={F:-1,C:0,G:1,D:2,A:3,E:4,B:5};
const F2L=['F','C','G','D','A','E','B'];
const mod=(n,m)=>((n%m)+m)%m;
const noteName=n=>{const a=Math.floor((n+1)/7);
  return F2L[mod(n+1,7)]+(a>0?'♯'.repeat(a):a<0?'♭'.repeat(-a):'');};
const simplify=n=>{while(n>6)n-=12;while(n<-6)n+=12;return n;};
const nn=n=>noteName(Math.abs(Math.floor((n+1)/7))>=2?simplify(n):n);
const pcOf=n=>mod(n*7,12);                    /* 五度圏インデックス → ピッチクラス */
const ROMAN=['I','II','III','IV','V','VI','VII'];
const degreeLabel=rel=>{const a=Math.floor((rel+1)/7);
  return (a>0?'♯'.repeat(a):a<0?'♭'.repeat(-a):'')+ROMAN[mod(rel*4,7)];};

/* ===================== クオリティ → 構成音 =====================
   半音ではなく「五度圏上の距離」で持つ。pcOf でピッチクラスに、noteName で綴りになる。
     0=R  4=M3  -3=m3  1=P5  -6=♭5  8=♯5  -1=P4(sus4)  3=6th/13th  -2=m7  5=M7  2=9th
   req = 必須 / opt = あってもなくてもよい。
   テンションコードでは5度を任意にする（実際の弾き方に合わせる）。 */
const Q_INT={
  ''      :{req:[0,4,1]},        'm'    :{req:[0,-3,1]},
  'aug'   :{req:[0,4,8]},        'sus4' :{req:[0,-1,1]},
  '6'     :{req:[0,4,1,3]},      'm6'   :{req:[0,-3,1,3]},
  '7'     :{req:[0,4,1,-2]},     'maj7' :{req:[0,4,1,5]},
  'm7'    :{req:[0,-3,1,-2]},    'm7♭5' :{req:[0,-3,-6,-2]},
  'dim7'  :{req:[0,-3,-6,3]},    'mM7'  :{req:[0,-3,1,5]},
  '7sus4' :{req:[0,-1,1,-2]},
  /* ↓ テンション：5度は任意 */
  'add9'  :{req:[0,4,2],     opt:[1]},
  '9'     :{req:[0,4,-2,2],  opt:[1]},
  'm9'    :{req:[0,-3,-2,2], opt:[1]},
  '13'    :{req:[0,4,-2,3],  opt:[1]},
};
const JAZZ_Q={'m':'-','maj7':'Δ7','m7':'-7','m7♭5':'ø7','dim7':'°7','sus4':'sus','7sus4':'7sus',
  'm6':'-6','m9':'-9','mM7':'-Δ7','aug':'+'};

/* ===================== プリセット（既存アプリから流用） ===================== */
const PRESETS=[
{tab:'1 三和音', note:'レベル1：三和音だけ。まず全調で手が動くこと。', items:[
  {name:'IV–V–I',       mode:'major', chords:[{rel:-1,q:''},{rel:1,q:''},{rel:0,q:''}]},
  {name:'I–IV–V–I',     mode:'major', chords:[{rel:0,q:''},{rel:-1,q:''},{rel:1,q:''},{rel:0,q:''}]},
  {name:'IV–I–V–I',     mode:'major', chords:[{rel:-1,q:''},{rel:0,q:''},{rel:1,q:''},{rel:0,q:''}]},
  {name:'IIm–V–I',      mode:'major', chords:[{rel:2,q:'m'},{rel:1,q:''},{rel:0,q:''}]},
  {name:'I–VIm–IV–V',   mode:'major', chords:[{rel:0,q:''},{rel:3,q:'m'},{rel:-1,q:''},{rel:1,q:''}]},

  {name:'IV–V–IIIm–VIm',mode:'major', chords:[{rel:-1,q:''},{rel:1,q:''},{rel:4,q:'m'},{rel:3,q:'m'}]},

   chords:[{rel:0,q:''},{rel:0,q:'',bass:4},{rel:-1,q:''},{rel:1,q:''}]},
  {name:'IV–IV/V–I',  mode:'major', chords:[{rel:-1,q:''},{rel:-1,q:'',bass:1},{rel:0,q:''}]}
]},
{tab:'2 四和音', note:'レベル2：ダイアトニックの四和音とツーファイブ。', items:[

   chords:[{rel:2,q:'m7'},{rel:2,q:'m7',bass:1},{rel:0,q:'maj7'}]}
]},

  {name:'王道 IVmaj7–V7–IIIm7–VIm7', mode:'major', chords:[{rel:-1,q:'maj7'},{rel:1,q:'7'},{rel:4,q:'m7'},{rel:3,q:'m7'}]},

  {name:'カノン I–V–VIm–IIIm–IV–I–IV–V', mode:'major', chords:[{rel:0,q:''},{rel:1,q:''},{rel:3,q:'m'},{rel:4,q:'m'},{rel:-1,q:''},{rel:0,q:''},{rel:-1,q:''},{rel:1,q:''}]},
  {name:'ブルース I7–IV7–I7–V7–IV7–I7', mode:'major', chords:[{rel:0,q:'7'},{rel:-1,q:'7'},{rel:0,q:'7'},{rel:1,q:'7'},{rel:-1,q:'7'},{rel:0,q:'7'}]},
  {name:'IV–V–VIm',                  mode:'major', chords:[{rel:-1,q:''},{rel:1,q:''},{rel:3,q:'m'}]},
  {name:'IIm7–V7–IIIm7–VIm7',        mode:'major', chords:[{rel:2,q:'m7'},{rel:1,q:'7'},{rel:4,q:'m7'},{rel:3,q:'m7'}]},
  {name:'IVmaj7–V7–VIm7',            mode:'major', chords:[{rel:-1,q:'maj7'},{rel:1,q:'7'},{rel:3,q:'m7'}]},
  {name:'カノン下行 I–V/VII–VIm–VIm/V–IV–I/III–IIm–V', mode:'major',
   chords:[{rel:0,q:''},{rel:1,q:'',bass:5},{rel:3,q:'m'},{rel:3,q:'m',bass:1},
           {rel:-1,q:''},{rel:0,q:'',bass:4},{rel:2,q:'m'},{rel:1,q:''}]},
  {name:'IV–V/IV–IIIm–VIm', mode:'major',
   chords:[{rel:-1,q:''},{rel:1,q:'',bass:-1},{rel:4,q:'m'},{rel:3,q:'m'}]}

{tab:'4 中級', note:'レベル4：セカンダリードミナントと経過的なディミニッシュ。', items:[

  {name:'Imaj7–I7–IVmaj7–IVm7', mode:'major', chords:[{rel:0,q:'maj7'},{rel:0,q:'7'},{rel:-1,q:'maj7'},{rel:-1,q:'m7'}]},
  {name:'VIIm7♭5–III7–VIm7',    mode:'major', chords:[{rel:5,q:'m7♭5'},{rel:4,q:'7'},{rel:3,q:'m7'}]},

  {name:'IVmaj7–♯IVdim7–I/V', mode:'major',

  {name:'IVmaj7–IVm7–IIIm7–VI7',      mode:'major', chords:[{rel:-1,q:'maj7'},{rel:-1,q:'m7'},{rel:4,q:'m7'},{rel:3,q:'7'}]},
  {name:'Imaj7–♭VImaj7–♭VIImaj7–Imaj7',mode:'major',chords:[{rel:0,q:'maj7'},{rel:-4,q:'maj7'},{rel:-2,q:'maj7'},{rel:0,q:'maj7'}]},
  {name:'Imaj7–♭III7–♭VImaj7',        mode:'major', chords:[{rel:0,q:'maj7'},{rel:-3,q:'7'},{rel:-4,q:'maj7'}]},
  {name:'IIIm7–♭IIIdim7–IIm7–V7',     mode:'major', chords:[{rel:4,q:'m7'},{rel:-3,q:'dim7'},{rel:2,q:'m7'},{rel:1,q:'7'}]},
  {name:'IIm7–♭II7–Imaj7–♭VII7',      mode:'major', chords:[{rel:2,q:'m7'},{rel:-5,q:'7'},{rel:0,q:'maj7'},{rel:-2,q:'7'}]},
  {name:'下行半音ベース I–I/VII–I/♭VII–IV/VI', mode:'major',
   chords:[{rel:0,q:''},{rel:0,q:'',bass:5},{rel:0,q:'',bass:-2},{rel:-1,q:'',bass:3}]}
]},
{tab:'短調', note:'度数は平行短調の I を基準にとります。', items:[
  {name:'IIm7♭5–V7–Im',        mode:'minor', chords:[{rel:2,q:'m7♭5'},{rel:1,q:'7'},{rel:0,q:'m'}]},
  {name:'IIm7♭5–V7–Im7',       mode:'minor', chords:[{rel:2,q:'m7♭5'},{rel:1,q:'7'},{rel:0,q:'m7'}]},
  {name:'Im–IVm–V7–Im',        mode:'minor', chords:[{rel:0,q:'m'},{rel:-1,q:'m'},{rel:1,q:'7'},{rel:0,q:'m'}]},
  {name:'アンダルシア Im–♭VII–♭VI–V7', mode:'minor', chords:[{rel:0,q:'m'},{rel:-2,q:''},{rel:-4,q:''},{rel:1,q:'7'}]},
  {name:'Im–♭VI–♭III–♭VII',    mode:'minor', chords:[{rel:0,q:'m'},{rel:-4,q:''},{rel:-3,q:''},{rel:-2,q:''}]},
  {name:'Im7–♭VImaj7–♭VIImaj7–Im7', mode:'minor', chords:[{rel:0,q:'m7'},{rel:-4,q:'maj7'},{rel:-2,q:'maj7'},{rel:0,q:'m7'}]},
  {name:'クリシェ Im–ImM7–Im7–Im6', mode:'minor', chords:[{rel:0,q:'m'},{rel:0,q:'mM7'},{rel:0,q:'m7'},{rel:0,q:'m6'}]},
  {name:'IVm7–♭VII7–♭IIImaj7', mode:'minor', chords:[{rel:-1,q:'m7'},{rel:-2,q:'7'},{rel:-3,q:'maj7'}]},
  {name:'Im7–IVm7–♭VIImaj7',   mode:'minor', chords:[{rel:0,q:'m7'},{rel:-1,q:'m7'},{rel:-2,q:'maj7'}]},
  {name:'下行ベース Im–Im/♭VII–♭VI–V7', mode:'minor',
   chords:[{rel:0,q:'m'},{rel:0,q:'m',bass:-2},{rel:-4,q:''},{rel:1,q:'7'}]}
]}
];

const KEYPATS=[
  {id:'fix',  name:'固定',   step:null},
  {id:'P4u',  name:'4度上',  step:5},
  {id:'P5u',  name:'5度上',  step:7},
  {id:'m2u',  name:'半音上',  step:1},
  {id:'M2u',  name:'全音上',  step:2},
  {id:'m3d',  name:'短3度下', step:-3},
  {id:'rand', name:'ランダム', step:'r'},
];

/* ===================== 状態 ===================== */
const state={
  presetTab:1, presetIdx:1,     /* 既定：IIm7–V7–Imaj7 */
  keyFifth:0, keyPat:'P4u',
  pos:0, cycles:0, cleared:0,
  notation:'std', showDeg:true, hint:false,
  graceMs:60,
};
const cur=()=>PRESETS[state.presetTab].items[state.presetIdx];
const chordAt=i=>cur().chords[i];
const isMinor=()=>cur().mode==='minor';
const refFifth=()=>state.keyFifth+(isMinor()?3:0);
const chordFifth=c=>refFifth()+c.rel;
const bassFifthOf=c=>refFifth()+c.bass;
const sameDeg=(a,b)=>a!=null&&b!=null&&mod(a-b,12)===0;
const hasBass=c=>c.bass!=null&&!sameDeg(c.bass,c.rel);
const qLabel=q=>state.notation==='jazz'?(JAZZ_Q[q]??q):q;
const keyOrder=()=>[0,1,2,3,4,5,6,-5,-4,-3,-2,-1];
const fifthOfPc=pc=>keyOrder().find(kf=>pcOf(kf)===pc);

/* 押している音（MIDIノート番号 → true）。集合で持つので重複ポートは自然に吸収される。 */
const held=new Set();
let badTimer=null, showBad=false;

/* ===================== 目標コードの展開 ===================== */
function target(){
  const c=chordAt(state.pos);
  const rf=chordFifth(c), spec=Q_INT[c.q]||Q_INT[''];
  const req=spec.req.map(f=>({f:rf+f, pc:pcOf(rf+f)}));
  const opt=(spec.opt||[]).map(f=>({f:rf+f, pc:pcOf(rf+f)}));
  const needPc=new Set(req.map(x=>x.pc));
  let bassPc=null;
  if(hasBass(c)){
    const bf=bassFifthOf(c);
    bassPc=pcOf(bf);
    if(!needPc.has(bassPc)){          /* F/G の G のように構成音でないベースを必須に加える */
      needPc.add(bassPc); req.push({f:bf, pc:bassPc});
    }
  }
  const optPc=new Set(opt.map(x=>x.pc).filter(pc=>!needPc.has(pc)));
  return {c, rootFifth:rf, req, opt, needPc, optPc, bassPc};
}

/* ===================== 判定（資料6章） ===================== */
function judge(t){
  const played=new Set([...held].map(n=>mod(n,12)));
  const missing=[...t.needPc].filter(pc=>!played.has(pc));
  const extra  =[...played].filter(pc=>!t.needPc.has(pc)&&!t.optPc.has(pc));
  let bassOk=true;
  if(t.bassPc!==null&&held.size) bassOk=mod(Math.min(...held),12)===t.bassPc;
  return {played, missing, extra, bassOk,
          ok: missing.length===0 && extra.length===0 && bassOk};
}

/* ===================== 進行 ===================== */
function advance(){
  state.pos++;
  if(state.pos>=cur().chords.length){
    state.pos=0; state.cycles++;
    const p=KEYPATS.find(k=>k.id===state.keyPat);
    if(p&&p.step!==null){
      const now=pcOf(state.keyFifth);
      let next;
      if(p.step==='r'){ do{ next=Math.floor(Math.random()*12); }while(next===now); }
      else next=mod(now+p.step,12);
      state.keyFifth=fifthOfPc(next);
    }
  }
  clearBad();
}
function restart(){ state.pos=0; state.cycles=0; state.cleared=0; clearBad(); render(); }
function clearBad(){ if(badTimer){clearTimeout(badTimer);badTimer=null;} showBad=false; }

/* ===================== MIDI 受信 ===================== */
function onNote(num,on){
  if(on){ held.add(num); goodUntil=0; }   /* 次のコードを弾き始めたら正解の緑を消す */
  else held.delete(num);
  const t=target(), r=judge(t);

  if(r.ok){
    state.cleared++;
    flashGood();
    advance();
    render();
    return;
  }
  /* 間違いは猶予を置いてから赤くする（コードの移り変わりを誤検出しないため） */
  clearBad();
  if(r.extra.length||(!r.bassOk&&held.size)){
    badTimer=setTimeout(()=>{
      badTimer=null;
      const t2=target(), r2=judge(t2);
      if(!r2.ok&&(r2.extra.length||(!r2.bassOk&&held.size))){ showBad=true; render(); }
    }, Math.max(0,state.graceMs));
  }
  render();
}

function handleMessage(data){
  const st=data[0];
  if(st>=0xF0) return;
  const type=st&0xF0, d1=data[1], d2=data[2];
  if(type===0x90&&d2>0) onNote(d1,true);
  else if(type===0x80||(type===0x90&&d2===0)) onNote(d1,false);   /* vel0 は保険 */
}

let midi=null;
async function connect(){
  if(!navigator.requestMIDIAccess){
    setStatus('このブラウザは Web MIDI API に非対応です（Safari は非対応。iPadでは MIDIWeb Browser、Macでは Chrome）','ng');
    return;
  }
  setStatus('接続中…');
  try{ midi=await navigator.requestMIDIAccess({sysex:false}); }
  catch(e){ setStatus('MIDIへのアクセスが拒否されました: '+e.message,'ng'); return; }
  midi.onstatechange=attachAll;
  attachAll();
  document.getElementById('btnConnect').disabled=true;
}
function attachAll(){
  const names=[];
  for(const i of midi.inputs.values()){
    i.onmidimessage=ev=>handleMessage(ev.data);
    names.push(i.name);
  }
  if(!names.length) setStatus('入力デバイスが見つかりません（ピアノの電源・Bluetooth MIDI のペアリングを確認）','ng');
  else{ setStatus('接続済み：'+names.join(' / '),'ok'); setMsg('弾いてください','dim'); }
}
const setStatus=(t,c)=>{const e=document.getElementById('status');e.textContent=t;e.className=c||'';};
const setMsg=(t,c)=>{const e=document.getElementById('msg');e.textContent=t;e.className='msg '+(c||'');};

/* ===================== 表示 ===================== */
const $=id=>document.getElementById(id);

function chordText(c){
  const root=nn(chordFifth(c));
  const b=hasBass(c)?`<span class="b">/${nn(bassFifthOf(c))}</span>`:'';
  return root+qLabel(c.q)+b;
}
function degText(c){
  return degreeLabel(c.rel)+qLabel(c.q)+(hasBass(c)?'/'+degreeLabel(c.bass):'');
}
const keyLabel=()=>isMinor()?nn(state.keyFifth+3)+'m':nn(state.keyFifth);

let goodUntil=0;
function flashGood(){ goodUntil=performance.now()+260; setTimeout(render,270); }

function render(){
  const t=target(), c=t.c, r=judge(t);
  const chords=cur().chords;

  $('keyName').textContent=keyLabel();
  $('progName').textContent=cur().name;
  $('counter').textContent=`${state.pos+1} / ${chords.length}　周 ${state.cycles}　正解 ${state.cleared}`;

  $('chord').innerHTML=chordText(c);
  $('deg').innerHTML=state.showDeg?degText(c):'&nbsp;';
  const nx=chords[(state.pos+1)%chords.length];
  $('next').innerHTML=chords.length>1?`次： <b>${chordText(nx)}</b>`:'&nbsp;';

  const stage=$('stage');
  stage.className='stage'+(performance.now()<goodUntil?' good':(showBad?' bad':''));

  /* 状態メッセージ */
  if(performance.now()<goodUntil) setMsg('正解','ok');
  else if(showBad&&r.extra.length) setMsg(`余分な音が ${r.extra.length} つ`,'ng');
  else if(showBad&&!r.bassOk) setMsg(`最低音が ${nn(bassFifthOf(c))} ではありません`,'ng');
  else if(!held.size) setMsg(midi?'弾いてください':'「MIDIに接続」を押してください','dim');
  else if(r.missing.length) setMsg(`あと ${r.missing.length} 音`,'dim');
  else setMsg('　','dim');

  /* 構成音ヒント */
  $('hintBox').hidden=!state.hint;
  if(state.hint){
    const box=$('hintChips'); box.textContent='';
    const add=(x,cls)=>{
      const s=document.createElement('span');
      s.className='chip '+cls+(x.pc===t.bassPc?' bass':'');
      s.textContent=nn(x.f);
      if(r.played.has(x.pc)) s.className='chip got'+(x.pc===t.bassPc?' bass':'');
      box.appendChild(s);
    };
    t.req.forEach(x=>add(x,'need'));
    t.opt.filter(x=>t.optPc.has(x.pc)).forEach(x=>add(x,'opt'));
  }

  /* 押している音 */
  const pbox=$('playChips'); pbox.textContent='';
  if(!held.size){
    const s=document.createElement('span');
    s.style.cssText='color:var(--dim);font-size:13px'; s.textContent='なし';
    pbox.appendChild(s);
  }else{
    const lo=Math.min(...held);
    [...held].sort((a,b)=>a-b).forEach(n=>{
      const pc=mod(n,12);
      const bad=showBad&&r.extra.includes(pc);
      const isLow=n===lo&&t.bassPc!==null;
      const s=document.createElement('span');
      s.className='chip '+(bad?'bad':'got')+(isLow?(r.bassOk?' bass':' bassng'):'');
      s.textContent=PC_NAMES[pc]+(Math.floor(n/12)-1);
      pbox.appendChild(s);
    });
  }

  drawKeyboard(t,r);
}

/* ---- 鍵盤 ---- */
const PC_NAMES=['C','C♯','D','D♯','E','F','F♯','G','G♯','A','A♯','B'];
const isBlack=pc=>[1,3,6,8,10].includes(pc);
function drawKeyboard(t,r){
  /* 既定は C2〜C6。範囲外の音を弾いたらオクターブ単位で広げる（音が消えないように） */
  let LO=36, HI=84;
  if(held.size){
    LO=Math.min(LO, Math.floor(Math.min(...held)/12)*12);
    HI=Math.max(HI, Math.ceil((Math.max(...held)+1)/12)*12);
  }
  const whites=[]; for(let n=LO;n<=HI;n++) if(!isBlack(mod(n,12))) whites.push(n);
  const W=100/whites.length, H=26, BW=W*0.62, BH=H*0.62;
  const lo=held.size?Math.min(...held):null;
  const fill=n=>{
    if(!held.has(n)) return null;
    const pc=mod(n,12);
    if(showBad&&r.extra.includes(pc)) return '#c9403c';
    if(t.bassPc!==null&&n===lo) return r.bassOk?'#c9a227':(showBad?'#c9403c':'#6b6055');
    return '#3f9fd0';
  };
  let s='';
  whites.forEach((n,i)=>{
    const f=fill(n);
    s+=`<rect x="${(i*W).toFixed(3)}" y="0" width="${(W*0.97).toFixed(3)}" height="${H}" rx="0.5" `
      +`fill="${f||'#e9e2d6'}" stroke="#14110f" stroke-width="0.25"/>`;
  });
  /* 黒鍵：白鍵の境目に置く */
  for(let n=LO;n<=HI;n++){
    if(!isBlack(mod(n,12))) continue;
    const wi=whites.findIndex(w=>w>n);        /* 右隣の白鍵 */
    if(wi<0) continue;
    const f=fill(n);
    s+=`<rect x="${(wi*W-BW/2).toFixed(3)}" y="0" width="${BW.toFixed(3)}" height="${BH.toFixed(3)}" rx="0.4" `
      +`fill="${f||'#221e1b'}" stroke="#14110f" stroke-width="0.25"/>`;
  }
  /* C の目印 */
  whites.forEach((n,i)=>{
    if(mod(n,12)!==0) return;
    s+=`<text x="${(i*W+W*0.48).toFixed(3)}" y="${H-1.2}" text-anchor="middle" font-size="2.6" `
      +`fill="${held.has(n)?'rgba(255,255,255,.75)':'#9c9483'}">C${Math.floor(n/12)-1}</text>`;
  });
  $('kb').innerHTML=s;
}

/* ---- 設定UI ---- */
function renderSettings(){
  $('tabs').innerHTML=PRESETS.map((g,i)=>
    `<button class="pat-btn${i===state.presetTab?' on':''}" data-tab="${i}">${g.tab}</button>`).join('');
  $('plist').innerHTML=PRESETS[state.presetTab].items.map((it,i)=>
    `<button class="${i===state.presetIdx?"on":""}" data-item="${i}">${it.name}</button>`).join('');
  $('presetNote').textContent=PRESETS[state.presetTab].note;
  $('keyPat').innerHTML=KEYPATS.map(p=>
    `<button class="pat-btn${p.id===state.keyPat?' on':''}" data-kp="${p.id}">${p.name}</button>`).join('');
  $('btnNotation').classList.toggle('on',state.notation==='jazz');
  $('btnDegree').classList.toggle('on',state.showDeg);
  $('btnHint').classList.toggle('on',state.hint);
}

/* ---- 配線 ---- */
$('btnConnect').onclick=connect;
$('btnSkip').onclick=()=>{ advance(); render(); };
$('btnRestart').onclick=restart;
$('btnHint').onclick=()=>{ state.hint=!state.hint; renderSettings(); render(); };
$('btnNotation').onclick=()=>{ state.notation=state.notation==='jazz'?'std':'jazz'; renderSettings(); render(); };
$('btnDegree').onclick=()=>{ state.showDeg=!state.showDeg; renderSettings(); render(); };
$('grace').oninput=e=>{ state.graceMs=Math.max(0,Math.min(500,+e.target.value||0)); };
$('tabs').onclick=e=>{ const b=e.target.closest('[data-tab]'); if(!b)return;
  state.presetTab=+b.dataset.tab; state.presetIdx=0; restart(); renderSettings(); };
$('plist').onclick=e=>{ const b=e.target.closest('[data-item]'); if(!b)return;
  state.presetIdx=+b.dataset.item; restart(); renderSettings(); };
$('keyPat').onclick=e=>{ const b=e.target.closest('[data-kp]'); if(!b)return;
  state.keyPat=b.dataset.kp; renderSettings(); };

/* テスト用：実機と同じ経路に偽MIDIを流す */
window.__inject=bytes=>handleMessage(Uint8Array.from(bytes));
window.__dbg={state,held,target,judge,render,advance,nn,pcOf,chordFifth,bassFifthOf,PRESETS};

if(!navigator.requestMIDIAccess){
  setStatus('このブラウザは Web MIDI API に非対応です（iPadでは MIDIWeb Browser、Macでは Chrome）','ng');
  $('btnConnect').disabled=true;
}
renderSettings();
render();
</script>
</body>
</html>
